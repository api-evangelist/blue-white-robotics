aid: blue-white-robotics
name: Blue White Robotics
description: 'Blue White Robotics Ltd. — operating as Bluewhite — is an Israeli off-road
  autonomy company founded in 2017 by Ben Alfi, Yair Shahar and Aviram Shmueli, headquartered
  in Tel Aviv with a US operation in Fresno, California. Bluewhite builds an OEM-agnostic
  autonomy stack that retrofits conventional vehicles into unmanned ground vehicles:
  Pathfinder, an aftermarket autonomy kit combining control, intelligence and perception
  modules over a distributed CAN network, and Compass, a cloud fleet-operations SaaS
  that lets operators remotely supervise, task and monitor an autonomous fleet. The
  company began in permanent-crop agriculture — autonomous spraying, mowing and harvest
  support across roughly 150,000 US acres for 20-plus growers — and has since extended
  the same GPS-denied navigation and perception stack to defense and homeland-security
  ground robotics. Elbit Systems'' FUSE acquired 100% of Blue White Robotics in 2026.
  Bluewhite markets a Software SDK and an "API platform" for OEM and system integration,
  but publishes no public developer portal, API reference, or machine-readable specification;
  the Compass operator platform sits behind a Keycloak/OIDC login and integration access
  runs through a contact-sales form.'
